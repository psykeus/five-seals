# MMC1, 128 KB PRG (banks 0-7, bank 7 fixed at $C000), CHR-RAM, 8 KB battery WRAM
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100;
}
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    RAM:    start = $0300, size = $0400, type = rw, define = yes;
    STACK:  start = $0700, size = __STACKSIZE__, type = rw, define = yes;
    WRAM:   start = $6000, size = $2000, type = rw;
    PRG0:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG2:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG3:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG4:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG5:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG6:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG7:   start = $C000, size = $3FFA, file = %O, fill = yes, fillval = $FF;
    VEC:    start = $FFFA, size = $0006, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HEADER:   load = HEADER, type = ro;
    STARTUP:  load = PRG7,   type = ro, define = yes;
    LOWCODE:  load = PRG7,   type = ro, optional = yes;
    ONCE:     load = PRG7,   type = ro, optional = yes;
    CODE:     load = PRG7,   type = ro, define = yes;
    RODATA7:  load = PRG7,   type = ro;
    CODE0:    load = PRG0,   type = ro, optional = yes;
    RODATA:   load = PRG0,   type = ro, define = yes;
    DATA:     load = PRG0, run = RAM, type = rw, define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
    SAVE:     load = WRAM,   type = bss, optional = yes;
    CHRDATA:  load = PRG1,   type = ro;
    VECTORS:  load = VEC,    type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
